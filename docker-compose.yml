version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: auction-mysql
    restart: always
    environment:
      MYSQL_DATABASE: auction_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: auction_user
      MYSQL_PASSWORD: auction_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/auction_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql
    networks:
      - auction-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auction_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: auction_user
      SPRING_DATASOURCE_PASSWORD: auction_pass
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - auction-network

  nginx:
    image: nginx:alpine
    container_name: auction-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge

volumes:
  mysql_data:
